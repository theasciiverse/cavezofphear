# Builds CAVEZ of PHEAR for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, cavezofphear-<target>.tar.gz, holding the
# phear binary with data/ beside it (where it looks first), plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). For everyone else: .deb, .rpm, .apk and Arch
# packages of the static Linux binary, made by nfpm (asciiverse/nfpm.yaml),
# with the data in /usr/share/phear, the binary's build-time fallback.
#
# Tags look like v0.6.2-av.1: upstream's version, then our packaging
# release. Linux builds run in Alpine and link ncurses statically; macOS
# links the system ncurses. No Windows: the game uses POSIX signals and
# nanosleep.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: cavezofphear
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          # FindCurses picks the shared libraries, so name the static ones
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base cmake ncurses-dev ncurses-static &&
            cmake -S . -B out -DWITH_MANPAGE=OFF -DSYSTEMWIDE=ON -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_BUILD_TYPE=Release \
              -DCURSES_CURSES_LIBRARY=/usr/lib/libncurses.a -DCURSES_NCURSES_LIBRARY=/usr/lib/libncurses.a \
              -DCURSES_EXTRA_LIBRARY=/usr/lib/libtinfo.a -DCURSES_FORM_LIBRARY=/usr/lib/libform.a \
              -DCMAKE_EXE_LINKER_FLAGS="-static -s" &&
            cmake --build out'
          sudo chown -R "$(id -u):$(id -g)" out
          file out/phear

      - name: Package for av
        run: |
          # the binary at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp out/phear LICENSE README.md PATCHES.md stage/
          cp -r data stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          cmake -S . -B out -DWITH_MANPAGE=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build out
          strip out/phear
          file out/phear

      - name: Package
        run: |
          mkdir -p stage dist
          cp out/phear LICENSE README.md PATCHES.md stage/
          cp -r data stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "CAVEZ of PHEAR $TAG" \
                 --notes "CAVEZ of PHEAR ${TAG%%-av.*} from github.com/AMDmi3/cavezofphear, Tom Rune Flo's Boulder Dash-style cave game, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
